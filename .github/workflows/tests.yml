name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # The tests use a fake Mac, so they run anywhere and only need pytest.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q

  macos-smoke:
    # Installs the real dependencies on Apple Silicon and makes sure the AppKit UI code loads.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -c "import heymac.lily, heymac.ui, heymac.app, heymac.hotkey; print('UI modules load')"
      - run: python -m pytest -q