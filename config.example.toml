# Copy to ~/.config/heymac/config.toml (or ./config.toml) and edit.
# Every setting is optional — defaults are shown.

[assistant]
name = "Jarvis"                 # shown in the bar
speak_replies = false           # read replies aloud with macOS `say`
memory_seconds = 120            # how long follow-ups ("open the second one") remember context

[ui]
style = "lily"                  # "lily" = glowing mascot in a corner (see mascot below), "bar" = Spotlight-style bar
corner = "bottom-right"         # bottom-right, bottom-left, top-right, top-left
mascot = "auto"                 # who sits in the corner: "auto" = an animal that matches your aesthetic
                                # (coffee=bear, matcha=frog, ocean=otter, sakura=bunny, midnight=owl,
                                #  sunset=fox, no preset=cat), "lily" = the flower, or always one animal:
                                # cat, bunny, frog, bear, fox, otter, owl

[activation]
wake_word = "hey_jarvis"        # built-in: hey_jarvis, alexa, hey_mycroft — or a path to your own .onnx model
wake_threshold = 0.5            # 0–1; raise if it triggers by accident, lower if it misses you
hotkey = "option+space"         # modifiers: cmd, option, ctrl, shift  +  a key: space, j, k, ...
enable_wake_word = true

[speech]
# Whisper model run locally on Apple Silicon. "whisper-large-v3-turbo" is accurate + fast on M-series.
# Use "mlx-community/whisper-small.en-mlx" on 8GB Macs.
model = "mlx-community/whisper-large-v3-turbo"
language = "en"
input_device = ""               # part of a mic name, e.g. "AirPods". Empty = the Mac's built-in mic
silence_seconds = 1.0           # stop recording after this much quiet
max_seconds = 12
# Words Whisper should expect — helps with names it would otherwise mishear.
vocabulary = ["Cursor", "VS Code", "iMessage", "Spotify", "Notion", "Figma", "GitHub"]

[send]
# Where "text me …" goes: your phone number (+15551234567) or Apple ID email.
# Leave empty to use the first phone number on your own card in Contacts.
me = ""

[ai]
# Which AI handles the harder requests. Simple commands ("open spotify") never use it.
#   "anthropic"  Claude (default)            key: ANTHROPIC_API_KEY in .env
#   "openai"     OpenAI                      key: OPENAI_API_KEY
#   "gemini"     Google Gemini               key: GEMINI_API_KEY
#   "ollama"     runs on your Mac, free and private, no key (install from ollama.com, then
#                `ollama pull qwen3:8b`)
#   "openai_compatible"  LM Studio, OpenRouter, Groq…  set model + base_url (+ api_key_env)
provider = "anthropic"
model = ""                      # empty = a cheap, capable default: claude-haiku-4-5, gpt-6-luna,
                                # gemini-3.8-flash, qwen3:8b. The model must support tool calling.
# base_url = "http://localhost:1234/v1"   # LM Studio / Ollama on another computer / OpenRouter…
# api_key_env = "OPENROUTER_API_KEY"      # if your key is in a differently named variable
max_tokens = 600

[files]
# Folders where your code projects live (used for "open X in Cursor")
project_roots = ["~/code", "~/Projects", "~/Developer", "~/Documents/GitHub", "~/dev", "~/src"]
# Extra folders to scan if Spotlight finds nothing
search_roots = ["~/Desktop", "~/Documents", "~/Downloads"]

[aliases]
# Spoken name  ->  real app name. Add your own.
"chrome" = "Google Chrome"
"messages" = "Messages"
"imessage" = "Messages"
"texts" = "Messages"
"vs code" = "Visual Studio Code"
"vscode" = "Visual Studio Code"
"code" = "Visual Studio Code"
"terminal" = "Terminal"
"settings" = "System Settings"
"mail" = "Mail"
"music" = "Music"

# ---------------------------------------------------------------- aesthetics
# Say "coffee mode" / "change my aesthetic to matcha" / "undo my aesthetic".
# Every setting is optional — a preset only changes what you list.
#   wallpaper     a picture, or a folder (a random picture from it each time)
#   appearance    "light" or "dark"
#   playlist      Spotify link (Share → Copy link) — needs the Spotify desktop app
#   volume        Spotify volume 0-100        shuffle  true/false
#   system_volume your Mac's volume 0-100
#   lily          lily colors: lily, coffee, matcha, ocean, sakura, midnight, sunset,
#                 or your own: { petal = "#8B5A3C", tip = "#F5E6D3", glow = "#D4A373" }
#   mascot        cat, bunny, frog, bear, fox, otter, owl or lily (leave out = matches the lily colors)
#   editor_theme  Cursor + VS Code color theme (or cursor_theme / vscode_theme separately)
#   dock          { size = 16-128, position = "left"/"bottom"/"right", autohide = true }
#   accent        graphite, red, orange, yellow, green, blue, purple, pink, multicolor
#   shortcut      name of an Apple Shortcut to run (Focus modes, lights, Night Shift…)
#   open / quit   lists of apps          message  what Jarvis says when it's done

[presets.coffee]
wallpaper    = "~/Pictures/Aesthetics/coffee"
appearance   = "dark"
lily         = "coffee"
mascot       = "bear"
editor_theme = "Default Dark Modern"
# playlist   = "https://open.spotify.com/playlist/PASTE-YOUR-PLAYLIST-ID"
volume       = 25
message      = "Coffee mode on ☕"

[presets.matcha]
wallpaper    = "~/Pictures/Aesthetics/matcha"
appearance   = "light"
lily         = "matcha"
mascot       = "frog"
editor_theme = "Default Light Modern"
# playlist   = "https://open.spotify.com/playlist/PASTE-YOUR-PLAYLIST-ID"
volume       = 30
message      = "Matcha mode on 🍵"