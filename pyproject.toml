[project]
name = "hey-mac"
version = "0.1.0"
description = "A local voice assistant for macOS: Whisper + wake word + Claude, OpenAI, Gemini or Ollama, with a little animal in the corner"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christine Xu" }]
requires-python = ">=3.11"
keywords = ["macos", "voice-assistant", "whisper", "claude", "speech-recognition", "productivity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X :: Cocoa",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Utilities",
]
dependencies = [
  "anthropic>=0.40", "httpx>=0.27", "numpy", "sounddevice", "soxr", "openwakeword==0.6.0",
  "mlx-whisper>=0.4; platform_machine == 'arm64'",
  "faster-whisper; platform_machine != 'arm64'",
  "pyobjc-core", "pyobjc-framework-Cocoa", "pyobjc-framework-Quartz",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/tinexu/hey-mac"
Issues = "https://github.com/tinexu/hey-mac/issues"

[project.scripts]
heymac = "heymac.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["heymac"]

[tool.pytest.ini_options]
testpaths = ["tests"]